<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Sawatâ…</title>
</head>
<body style="margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:Arial, Helvetica, sans-serif; background:#F4FAF6; color:#34443A; box-sizing:border-box; padding:24px;">
  <div style="width:100%; max-width:360px; background:#FFFFFF; border-radius:20px; box-shadow:0 8px 28px rgba(22,51,43,0.08); padding:36px 28px; text-align:center;">
    <div style="width:56px; height:56px; margin:0 auto 20px; border-radius:16px; background:#DDEEE7; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; color:#2E7D6B;">
      S
    </div>
    <h2 style="margin:0 0 10px; font-size:19px;">Opening Sawatâ…</h2>
    <p style="margin:0 0 26px; color:#6F7F75; font-size:13.5px; line-height:1.6;">
      If the app didn't open automatically, make sure Sawatâ is installed on
      this device, then tap the button below.
    </p>
    <a href="sawata://guardian-invites" style="display:block; background:#2E7D6B; color:#FFFFFF; text-decoration:none; font-weight:bold; font-size:15px; padding:15px 0; border-radius:12px;">
      Open Sawatâ
    </a>
    <p style="margin:24px 0 10px; color:#9AA8A0; font-size:12.5px;">
      Don't have the app yet?
    </p>
    <a href="sawata.apk" style="display:block; background:#FFFFFF; color:#2E7D6B; text-decoration:none; font-weight:bold; font-size:15px; padding:13px 0; border-radius:12px; border:2px solid #2E7D6B; box-sizing:border-box;">
      Download Sawatâ
    </a>
  </div>
  <script>
    // Gmail (and most mail clients) strip non-http(s) hrefs from HTML
    // email, so the guardian-invite email links here instead of directly
    // to sawata://guardian-invites — this page bridges the gap. The
    // attempt runs through a hidden iframe (after the visible content
    // above has already painted) rather than navigating the page itself
    // via location.replace, so a device without Sawatâ installed simply
    // keeps showing this fallback instead of being left on a blank page.
    window.addEventListener('load', function () {
      var iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = 'sawata://guardian-invites';
      document.body.appendChild(iframe);
    });
  </script>
</body>
</html>
