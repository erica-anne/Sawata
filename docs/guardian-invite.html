<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Sawatâ…</title>
</head>
<body style="margin:0; font-family:Arial, Helvetica, sans-serif; background:#F4FAF6; color:#34443A; text-align:center; padding:70px 24px;">
  <h2 style="margin:0 0 12px;">Opening Sawatâ…</h2>
  <p style="margin:0 0 24px; color:#6F7F75; font-size:14px; line-height:1.6;">
    If the app didn't open automatically, make sure Sawatâ is installed on
    this device, then tap the button below.
  </p>
  <a href="sawata://guardian-invites" style="display:inline-block; background:#2E7D6B; color:#FFFFFF; text-decoration:none; font-weight:bold; padding:14px 30px; border-radius:12px;">
    Open Sawatâ
  </a>
  <p style="margin:28px 0 8px; color:#6F7F75; font-size:13px;">
    Don't have the app yet?
  </p>
  <a href="sawata.apk" style="display:inline-block; background:#FFFFFF; color:#2E7D6B; text-decoration:none; font-weight:bold; padding:12px 26px; border-radius:12px; border:2px solid #2E7D6B;">
    Download Sawatâ
  </a>
  <script>
    // Gmail (and most mail clients) strip non-http(s) hrefs from HTML
    // email, so the guardian-invite email links here instead of directly
    // to sawata://guardian-invites — this page bridges the gap. The
    // attempt runs through a hidden iframe (after the visible content
    // above has already painted) rather than navigating the page itself
    // via location.replace, so a device without Sawatâ installed simply
    // keeps showing this fallback instead of being left on a blank page.
    window.addEventListener('load', function () {
      var iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = 'sawata://guardian-invites';
      document.body.appendChild(iframe);
    });
  </script>
</body>
</html>
