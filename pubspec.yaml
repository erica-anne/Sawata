name: sawata
description: "Sawata — gambling-recovery accountability app (UI prototype)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.69.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.7.1
  firebase_messaging: ^16.4.3
  http: ^1.2.2
  app_links: ^7.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - images/sawata_logo.png
    - images/sawata_guardian_logo.png
